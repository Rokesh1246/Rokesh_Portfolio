name: rokesh_portfolio
description: "Rokesh's Professional Portfolio - Full Stack Developer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  animate_do: ^3.3.4
  font_awesome_flutter: ^11.0.0
  visibility_detector: ^0.4.0+2
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/resume/
    - assets/projects/
